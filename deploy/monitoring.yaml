apiVersion: v1
kind: Namespace
metadata:
  name: ate-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: substrate-aks-otel
  namespace: ate-system
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 64
      transform:
        error_mode: propagate
        metric_statements:
          - context: resource
            statements:
              - keep_keys(resource.attributes, ["service.name", "service.instance.id", "k8s.namespace.name", "k8s.pod.name"])
          - context: metric
            statements:
              - convert_exponential_histogram_to_histogram("upper", [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 120.0])
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        metric_expiration: 5m
        resource_to_telemetry_conversion:
          enabled: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, transform, batch]
          exporters: [prometheus]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate-aks-otel
  namespace: ate-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: substrate-aks-otel
  template:
    metadata:
      annotations:
        substrate-aks/config-sha256: "{{ .ConfigHash }}"
      labels:
        app: substrate-aks-otel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6
          args: [--config=/etc/otel/config.yaml]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: metrics
              containerPort: 8889
            - name: self-metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              port: health
              path: /
          livenessProbe:
            httpGet:
              port: health
              path: /
            initialDelaySeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: substrate-aks-otel
---
apiVersion: v1
kind: Service
metadata:
  name: substrate-aks-otel
  namespace: ate-system
spec:
  selector:
    app: substrate-aks-otel
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: substrate-aks-otel
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: substrate-aks-otel
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [ate-api-server, ate-controller, ate-idp-server, atelet, atenet-router]
      ports:
        - protocol: TCP
          port: otlp-grpc
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              rsName: ama-metrics
      ports:
        - protocol: TCP
          port: metrics
        - protocol: TCP
          port: self-metrics
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: substrate-aks-otel
  namespace: ate-system
spec:
  labelLimit: 63
  labelNameLengthLimit: 511
  labelValueLengthLimit: 1023
  selector:
    matchLabels:
      app: substrate-aks-otel
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      honorLabels: true
    - port: self-metrics
      interval: 30s
---
apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: substrate-aks-envoy
  namespace: ate-system
spec:
  labelLimit: 63
  labelNameLengthLimit: 511
  labelValueLengthLimit: 1023
  selector:
    matchLabels:
      app: atenet-router
  podMetricsEndpoints:
    - port: envoy-metrics
      path: /stats/prometheus
      interval: 30s
