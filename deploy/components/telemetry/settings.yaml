apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-otel-config
  namespace: ate-system
data:
  $patch: replace
{{ if .MonitoringEnabled }}
  OTEL_SDK_DISABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://substrate-aks-otel.ate-system.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_METRIC_EXPORT_INTERVAL: "30000"
  OTEL_METRICS_EXPORTER: otlp
  ATE_WORKER_OTEL_METRICS_EXPORTER: otlp
{{ else }}
  OTEL_SDK_DISABLED: "true"
  OTEL_METRICS_EXPORTER: none
  ATE_WORKER_OTEL_METRICS_EXPORTER: none
{{ end }}
  OTEL_TRACES_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  ATE_WORKER_OTEL_LOGS_EXPORTER: none
  ATE_WORKER_OTEL_TRACES_EXPORTER: none
