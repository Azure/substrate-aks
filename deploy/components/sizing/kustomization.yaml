apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
{{- if or .Sizing.Replicas .Sizing.Containers}}
- path: workload.yaml
{{- end}}
{{- if or .Sizing.UploadDelay .Sizing.DetachDelay}}
- path: delays.yaml
  target:
    group: apps
    version: v1
    kind: DaemonSet
    name: atelet
    namespace: ate-system
{{- end}}
