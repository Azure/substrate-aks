apiVersion: apps/v1
kind: {{.Kind}}
metadata:
  name: {{.Name}}
  namespace: ate-system
spec:
  template:
    spec:
      initContainers:
      - name: objectstore-plugin
        image: {{quote .PluginImage}}
        args:
        - {{.Mode}}
        - --socket=/run/objectstore-plugin/{{.Mode}}.sock
        - {{quote (printf "--account-url=%s" .AccountURL)}}
        - {{quote (printf "--containers=%s" .Snapshots)}}
{{if eq .Mode "node"}}
        - --root=/var/lib/ate
        - {{quote (printf "--asset-containers=%s" .Assets)}}
        - --asset-staging-dir=/var/lib/objectstore-plugin/asset-staging
        - --asset-staging-capacity=8Gi
{{end}}
        startupProbe:
          $patch: replace
          exec:
            command:
            - /ko-app/azure-blob-objectstore-plugin
            - healthcheck
            - --socket=/run/objectstore-plugin/{{.Mode}}.sock
          periodSeconds: 2
          failureThreshold: 30
        env:
        - name: AZURE_CLIENT_ID
          value: {{quote .ClientID}}
        - name: AZURE_TENANT_ID
          value: {{quote .TenantID}}
        - name: AZURE_FEDERATED_TOKEN_FILE
          value: /var/run/secrets/azure/tokens/azure-identity-token
        volumeMounts:
        - name: azure-identity-token
          mountPath: /var/run/secrets/azure/tokens
          readOnly: true
      volumes:
      - name: azure-identity-token
        projected:
          sources:
          - serviceAccountToken:
              audience: api://AzureADTokenExchange
              expirationSeconds: 3600
              path: azure-identity-token
