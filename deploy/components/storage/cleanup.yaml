# Delete owned list entries before adding them, so stale volume-source or
# valueFrom fields cannot survive a strategic merge on a repeated adaptation.
apiVersion: apps/v1
kind: {{.Kind}}
metadata:
  name: {{.Name}}
  namespace: ate-system
spec:
  template:
    spec:
      initContainers:
      - name: objectstore-plugin
        env:
        - name: ATE_STORAGE_BACKEND
          $patch: delete
        - name: AZURE_CLIENT_ID
          $patch: delete
        - name: AZURE_TENANT_ID
          $patch: delete
        - name: AZURE_FEDERATED_TOKEN_FILE
          $patch: delete
      volumes:
      - name: azure-identity-token
        $patch: delete
{{if eq .Mode "node"}}
      - name: image-credential-provider-bin
        $patch: delete
      - name: image-credential-provider-config
        $patch: delete
      - name: azure-cloud-config
        $patch: delete
{{end}}
